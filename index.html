<style>

  html, body {

    background: #050505;

  .page {
    min-height: 100vh;

    font-size: 26px;
    color: #D4AF37;

    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9a9488;
    max-width: 320px;
    line-height: 1.6;
  }
  .btn {
    margin-top: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 32px;
    height: 56px;
    border-radius: 999px;
    background: #D4AF37;
    color: #0a0908;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
